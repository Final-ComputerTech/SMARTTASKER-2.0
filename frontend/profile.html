<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Profile</title>
  <link rel="icon" href="/assets/icons/Profile.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="layout">
  <div id="sidebar"></div>
  <main class="main-content">
    <div id="header"></div>
    <section class="content-section mt-4">
      <h3 class="page-heading"><img src="/assets/icons/Profile.jpg" alt="Profile icon" class="page-icon"/> My Profile</h3>
      <div class="row">
        <div class="col-md-4">
          <div class="card p-3 text-center profile-card">
            <div class="avatar-wrapper mb-3">
              <img id="avatarPreview" src="/assets/icons/Profile.jpg" alt="avatar" class="avatar-preview" />
            </div>
            <div>
              <input type="file" id="avatarFile" accept="image/*" class="form-control-file" />
              <button id="uploadAvatarBtn" class="btn btn-sm btn-primary mt-2 upload-btn">Upload</button>
            </div>
          </div>
        </div>
        <div class="col-md-8">
          <div class="card p-3">
            <form id="profileEditForm">
              <div class="mb-3">
                <label class="form-label">Name</label>
                <input id="p_name" class="form-control" />
              </div>
              <div class="mb-3">
                <label class="form-label">Email (read-only)</label>
                <input id="p_email" class="form-control" readonly />
              </div>
                <div class="mb-3">
                  <label class="form-label">Biography</label>
                  <textarea id="p_bio" class="form-control" rows="3" placeholder="A short bio (optional)"></textarea>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Gender</label>
                    <select id="p_gender" class="form-control">
                      <option value="">Prefer not to say</option>
                      <option value="male">Male</option>
                      <option value="female">Female</option>
                      <option value="other">Other</option>
                    </select>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Date of birth</label>
                    <input id="p_dob" type="date" class="form-control" />
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label">Phone</label>
                  <input id="p_phone" class="form-control" />
                </div>
                <div class="mb-3">
                  <label class="form-label">Address</label>
                  <input id="p_address" class="form-control" />
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Timezone</label>
                    <select id="p_timezone" class="form-control">
                      <option value="">(system default)</option>
                      <option value="UTC">UTC</option>
                      <option value="America/New_York">America/New_York</option>
                      <option value="Europe/London">Europe/London</option>
                      <option value="Asia/Ho_Chi_Minh">Asia/Ho_Chi_Minh</option>
                      <option value="Asia/Tokyo">Asia/Tokyo</option>
                    </select>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Language</label>
                    <select id="p_language" class="form-control">
                      <option value="">(system default)</option>
                      <option value="en">English</option>
                      <option value="vi">Tiếng Việt</option>
                      <option value="ja">日本語</option>
                    </select>
                  </div>
                </div>
              <button class="btn btn-primary">Save</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="assets/js/utils/componentLoader.js"></script>
  <script type="module" src="assets/js/pages/profile.js"></script>
</body>
</html>
