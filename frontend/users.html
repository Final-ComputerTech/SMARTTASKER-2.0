<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Users</title>
  <link rel="icon" href="/assets/icons/Profile.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="layout">
  <div id="sidebar"></div>
  <main class="main-content">
    <div id="header"></div>
    <section class="content-section mt-4">
      <h3>User Management</h3>
      <div class="card p-3 mb-3">
        <h5>Create User</h5>
        <form id="createUserForm">
          <div class="mb-2"><input id="u_name" class="form-control" placeholder="Name"></div>
          <div class="mb-2"><input id="u_email" class="form-control" placeholder="Email"></div>
          <div class="mb-2"><input id="u_password" type="password" class="form-control" placeholder="Password"></div>
          <div class="mb-2">
            <select id="u_role" class="form-control">
              <option value="member">Member</option>
              <option value="manager">Manager</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <button class="btn btn-primary">Create</button>
        </form>
      </div>

      <h3>Existing Users</h3>
      <table class="table table-sm" id="usersTable">
        <thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="assets/js/utils/componentLoader.js"></script>
  <script type="module" src="assets/js/pages/users.js"></script>
</body>
</html>
