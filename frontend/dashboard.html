<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="icon" href="/assets/icons/Profile.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="layout">

  <!-- Sidebar -->
  <div id="sidebar"></div>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Header -->
    <div id="header"></div>

    <!-- Dashboard Section -->
    <section class="content-section mt-4">
      <h3>Overview</h3>
      
      <!-- Metric Cards -->
      <div class="row g-3 mt-2">
        <div class="col-md-3">
          <div class="card p-3 text-center metric-card">
            <h5>Total Tasks</h5>
            <span id="totalTasks">0</span>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card p-3 text-center metric-card">
            <h5>Completed</h5>
            <span id="totalCompleted">0</span>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card p-3 text-center metric-card">
            <h5>Pending</h5>
            <span id="totalPending">0</span>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card p-3 text-center metric-card">
            <h5>Overdue</h5>
            <span id="totalOverdue">0</span>
          </div>
        </div>
      </div>

      <!-- dashboard-stats.html -->
      <div class="container mt-4">
        <div class="row g-3">
          <!-- By Priority -->
          <div class="col-lg-4 col-md-6 col-12">
            <div class="card p-3">
              <h5>By Priority</h5>
              <div class="d-flex justify-content-end mb-2">
                <button id="priorityExportBtn" class="btn btn-sm btn-outline-secondary">Export PNG</button>
              </div>
              <div class="chart-wrapper">
                <canvas id="priorityChart"></canvas>
              </div>
              <div id="priorityStats" class="mt-2"></div>
            </div>
          </div>

          <!-- By Status -->
          <div class="col-lg-4 col-md-6 col-12">
            <div class="card p-3">
              <h5>By Status</h5>
              <div class="d-flex justify-content-end mb-2">
                <button id="statusExportBtn" class="btn btn-sm btn-outline-secondary">Export PNG</button>
              </div>
              <div class="chart-wrapper">
                <canvas id="statusChart"></canvas>
              </div>
              <div id="statusStats" class="mt-2"></div>
            </div>
          </div>

          <!-- By Project -->
          <div class="col-lg-4 col-md-6 col-12">
            <div class="card p-3">
              <h5>By Project</h5>
              <div class="d-flex justify-content-end mb-2">
                <button id="projectExportBtn" class="btn btn-sm btn-outline-secondary">Export PNG</button>
              </div>
              <div class="chart-wrapper">
                <canvas id="projectChart"></canvas>
              </div>
              <div id="projectStats" class="mt-2"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-3 mt-4">
        <div class="col-md-6">
          <div class="card p-3">
            <h5>Upcoming Tasks (7 days)</h5>
            <ul class="list-group" id="recentTasks"></ul>
            <hr />
            <h6 class="mt-2">Recently Missed (3 days)</h6>
            <ul class="list-group mt-2" id="recentMissed"></ul>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card p-3">
            <h5>Recent Changes</h5>
            <div id="recentChanges" class="scrollable"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Chart.js (UMD) - explicit versioned build so source map resolves to CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" crossorigin="anonymous"></script>
  <!-- Component Loader + Dashboard JS -->
  <script type="module" src="assets/js/pages/dashboard.js"></script>
</body>
</html>
