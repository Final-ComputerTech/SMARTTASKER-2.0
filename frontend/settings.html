<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="layout">

  <!-- Sidebar -->
  <div id="sidebar"></div>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Header -->
    <div id="header"></div>

    <!-- Settings Section -->
    <section class="content-section mt-4">
      <h3>Settings</h3>

      <!-- Password Card -->
      <div class="card p-3">
        <h5>Change Password</h5>
        <form id="passwordForm">
          <div class="mb-3">
            <label for="currentPassword" class="form-label">Current Password</label>
            <input type="password" id="currentPassword" class="form-control">
          </div>
          <div class="mb-3">
            <label for="newPassword" class="form-label">New Password</label>
            <input type="password" id="newPassword" class="form-control">
          </div>
          <button type="submit" class="btn btn-warning">Change Password</button>
        </form>
      </div>

      <!-- Delete Account Card -->
      <div class="card p-3 mt-3 border-danger">
        <h5 class="text-danger">Danger Zone</h5>
        <p class="text-muted small">Deleting your account will remove your profile and cannot be undone.</p>
        <button id="deleteAccountBtn" class="btn btn-danger">Delete My Account</button>
      </div>

    </section>
  </main>

  <!-- Component Loader + Settings JS -->
  <script src="assets/js/utils/componentLoader.js"></script>
  <script type="module" src="assets/js/pages/settings.js"></script>
</body>
</html>
