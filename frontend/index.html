<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="icon" href="/assets/icons/Profile.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-page d-flex align-items-center justify-content-center">

  <div class="login-box shadow rounded">
    <h2 class="text-center mb-4 text-primary">Login</h2>
    <form id="loginForm">
      <input type="email" id="email" name="email" class="form-control mb-3" placeholder="Email" required>
      <input type="password" id="password" name="password" class="form-control mb-3" placeholder="Password" required>
      <div id="loginError" class="text-danger mb-3" style="min-height: 1.2em;"></div>
      <button type="submit" id="loginBtn" class="btn btn-primary w-100">Login</button>
    </form>
    <div class="text-center mt-3">
      <a href="#" id="openRegister">Don't have an account? Create one</a>
    </div>
  </div>

  <!-- Register Modal -->
  <div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true" style="display:none;">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Register</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="registerForm">
            <input type="text" id="regName" name="name" class="form-control mb-2" placeholder="Full name" required />
            <input type="email" id="regEmail" name="email" class="form-control mb-2" placeholder="Email" required />
            <input type="password" id="regPassword" name="password" class="form-control mb-2" placeholder="Password" required />
            <div id="registerError" class="text-danger mb-2" style="min-height:1.2em"></div>
            <div class="d-flex justify-content-end">
              <button type="submit" class="btn btn-primary">Create account</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/pages/login.js"></script>
  <script type="module" src="assets/js/pages/register.js"></script>
</body>
</html>
