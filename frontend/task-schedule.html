<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Schedule</title>
	<link rel="icon" href="/assets/icons/Profile.jpg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="layout">
<div id="sidebar"></div>
<main class="main-content">
<div id="header"></div>

<section class="content-section mt-4">
<div class="row g-3">
	<div class="col-md-4">
		<div class="card p-3">
			<h5>Mini Calendar</h5>
			<div class="mb-2 d-flex gap-2 align-items-center">
			  <div class="btn-group" role="group" aria-label="View selector">
			    <button id="viewDaily" class="btn btn-sm btn-outline-secondary">Daily</button>
			    <button id="viewWeekly" class="btn btn-sm btn-outline-secondary">Weekly</button>
			    <button id="viewMonthly" class="btn btn-sm btn-outline-secondary">Monthly</button>
			  </div>
			  <button id="openNewTaskBtnSmall" class="btn btn-sm btn-primary">+ New</button>
			</div>
			<div id="miniCalendar" style="min-height:280px;">Loading calendar...</div>
		</div>
	</div>
	<div class="col-md-8">
		<div class="card p-3">
			<div class="d-flex justify-content-between mb-2">
				<h5>Tasks</h5>
				<div class="d-flex gap-2">
										<button id="openNewTaskBtn" class="btn btn-sm btn-primary">New Task</button>
										<button id="openNewProjectBtn" class="btn btn-sm btn-outline-primary">New Project</button>
										<div id="searchWrap" style="position:relative; width:50%;">
											<input id="searchInput" class="form-control form-control-sm" placeholder="Search tasks..." />
											<div id="searchSuggestions" class="list-group" style="position:absolute;z-index:2050;left:0;right:0;display:none;max-height:260px;overflow:auto;"></div>
										</div>
				</div>
			</div>
			<div class="row mb-2 g-2">
			  <div class="col-md-3">
			    <select id="filterPriority" class="form-select form-select-sm"><option value="">All Priorities</option></select>
			  </div>
			  <div class="col-md-3">
			    <select id="filterStatus" class="form-select form-select-sm"><option value="">All Statuses</option></select>
			  </div>
			  <div class="col-md-3">
			    <select id="filterProject" class="form-select form-select-sm"><option value="">All Projects</option></select>
			  </div>
			  <div class="col-md-3 d-flex gap-2">
			    <input id="filterFrom" type="date" class="form-control form-control-sm" />
			    <input id="filterTo" type="date" class="form-control form-control-sm" />
			  </div>
			</div>
			<div class="d-flex justify-content-between align-items-center mb-2">
							<div>
								<label class="form-check-label me-2"><input id="filterMine" type="checkbox" class="form-check-input me-1"/> My tasks only</label>
								<label class="form-check-label me-2"><input id="filterAttachments" type="checkbox" class="form-check-input me-1"/> Has attachments</label>
								<label class="form-check-label me-2"><input id="filterOverdue" type="checkbox" class="form-check-input me-1"/> Overdue</label>
								<label class="form-check-label"><input id="filterOrphan" type="checkbox" class="form-check-input me-1"/> Orphan tasks</label>
							</div>
			  <div>
			    <button id="applyFilters" class="btn btn-sm btn-outline-secondary">Apply</button>
			    <button id="clearFilters" class="btn btn-sm btn-outline-secondary">Clear</button>
			  </div>
			</div>
			<div id="taskControls" class="mb-2 d-flex justify-content-between align-items-center">
			  <div class="d-flex gap-2 align-items-center">
			
			  </div>
			  <div class="d-flex align-items-center">
			    <div id="searchStatus" class="small text-muted me-3">Query</div>
			    <div id="paginationControls"></div>
			  </div>
			</div>
						
		</div>
	</div>
</div>
		<!-- full-width task table row -->
		<div class="row mt-3">
			<div class="col-12">
				<div class="card p-3">
					<h5>All Tasks</h5>
					<div id="taskTable">Loading tasks...</div>
				</div>
			</div>
		</div>
</section>
</main>
<!-- New Project Modal -->
<div class="modal fade" id="newProjectModal" tabindex="-1" aria-hidden="true" style="display:none;">
	<div class="modal-dialog modal-lg">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Create New Project</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<div class="mb-2">
					<label class="form-label">Project name</label>
					<input id="newProjectName" class="form-control" />
				</div>
				<div class="mb-2">
					<label class="form-label">Description (optional)</label>
					<textarea id="newProjectDesc" class="form-control" rows="3"></textarea>
				</div>
				<div class="mb-2">
					<label class="form-label">Tasks (one per line)</label>
					<textarea id="newProjectTasks" class="form-control" rows="6" placeholder="Enter one task title per line"></textarea>
					<div class="form-text">When you create the project, each line will become a new task assigned to this project.</div>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
				<button id="createProjectBtn" type="button" class="btn btn-primary">Create Project</button>
			</div>
		</div>
	</div>
</div>

<script src="assets/js/utils/componentLoader.js"></script>
<script type="module" src="assets/js/pages/newTask.js"></script>
<script type="module" src="assets/js/pages/projectCreate.js"></script>
<script type="module" src="assets/js/pages/taskSchedule.js"></script>
</body>
</html>
