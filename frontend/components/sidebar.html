<aside class="sidebar">
    <div class="sidebar-header">MyApp</div>
    <ul class="sidebar-menu">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="task-schedule.html">Task Schedule</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="notifications.html">Notifications <span id="notifBadge" style="display:inline-block;margin-left:6px;vertical-align:middle;">
        <span id="notifDot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:transparent;margin-right:6px;vertical-align:middle;"></span>
        <span id="notifCount" style="display:inline-block;vertical-align:middle;"></span>
          </span></a></li>
      <li><a href="settings.html">Settings</a></li>
      <li><a href="users.html">Users</a></li>
    </ul>
    <script>
      (function(){
        try { console.debug('[sidebar] badge script loaded'); } catch (e) {}
        const apiBase = (window.location.port && window.location.port !== '3000') ? 'http://localhost:3000/api' : '/api';

        async function refreshNotifBadge() {
          try {
            const token = localStorage.getItem('st_token');
            const badgeEl = document.getElementById('notifBadge'); if (!badgeEl) return;
            // ensure dot & count elements exist
            let dot = document.getElementById('notifDot');
            let count = document.getElementById('notifCount');
            if (!dot) { dot = document.createElement('span'); dot.id = 'notifDot'; dot.style.display='inline-block'; dot.style.width='8px'; dot.style.height='8px'; dot.style.borderRadius='50%'; dot.style.background='transparent'; dot.style.marginRight='6px'; dot.style.verticalAlign='middle'; badgeEl.insertBefore(dot, badgeEl.firstChild); }
            if (!count) { count = document.createElement('span'); count.id = 'notifCount'; count.style.display='inline-block'; count.style.verticalAlign='middle'; badgeEl.appendChild(count); }

            if (!token) { dot.style.background = '#ccc'; count.innerHTML = ''; badgeEl.title = ''; return; }

            const res = await fetch(`${apiBase}/notifications/unread-count`, { headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' } });
            const json = await res.json().catch(()=>({}));
            const unread = json && (json.unread_count || 0);
            const important = json && (json.important_count || 0);
            const overdueTasks = json && (json.overdue_tasks_count || 0);
            const noStatus = json && (json.no_status_tasks_count || 0);

            if (unread > 0) {
              dot.style.background = important>0 ? '#dc3545' : '#0dcaf0';
              count.innerHTML = `<span class="badge" style="background:${important>0?'#dc3545':'#0dcaf0'};color:white;padding:2px 6px;border-radius:999px;">${unread}</span>`;
              let title = `You have ${unread} unread notifications`;
              const extras = [];
              if (overdueTasks > 0) extras.push(`${overdueTasks} overdue task${overdueTasks>1?'s':''}`);
              if (noStatus > 0) extras.push(`${noStatus} task${noStatus>1?'s':''} without status`);
              if (extras.length) title += ' • ' + extras.join(' • ');
              badgeEl.title = title;
            } else {
              dot.style.background = '#ccc';
              count.innerHTML = '';
              badgeEl.title = '';
            }
          } catch (e) {
            try { const dot = document.getElementById('notifDot'); if (dot) dot.style.background = '#ccc'; const c = document.getElementById('notifCount'); if (c) c.innerHTML = ''; } catch(_) {}
          }
        }

        // Expose for other modules to call directly
        try { window.refreshNotifBadge = refreshNotifBadge; } catch (e) {}

        // Refresh on load
        refreshNotifBadge().catch(()=>{});

        // Periodic refresh in case events are missed (helps show dot on all pages)
        try { setInterval(() => { try { refreshNotifBadge().catch(()=>{}); } catch (_) {} }, 30 * 1000); } catch (e) {}

        // Refresh when task-related events occur elsewhere in the app
        document.addEventListener('task:created', () => { try { refreshNotifBadge(); } catch (e) {} });
        document.addEventListener('task:assignment-changed', () => { try { refreshNotifBadge(); } catch (e) {} });
        document.addEventListener('project:created', () => { try { refreshNotifBadge(); } catch (e) {} });

        // Some pages use localStorage to broadcast changes across tabs/windows
        window.addEventListener('storage', (ev) => {
          try {
            if (!ev || !ev.key) return;
            if (ev.key.startsWith('task:') || ev.key === 'task:assign') {
              setTimeout(() => { try { refreshNotifBadge(); } catch (_) {} }, 50);
            }
          } catch (e) {}
        });
      })();
    </script>
  </aside>
