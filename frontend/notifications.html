<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications</title>
  <link rel="icon" href="/assets/icons/Profile.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="layout">

  <!-- Sidebar -->
  <div id="sidebar"></div>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Header -->
    <div id="header"></div>

    <!-- Notifications Section -->
    <section class="content-section mt-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Notifications</h2>
        <div class="d-flex align-items-center">
          <input id="notifSearchInput" class="form-control form-control-sm me-2" placeholder="Search notifications..." style="min-width:220px;" />
          <button id="markAllReadBtn" class="btn btn-sm btn-primary">Mark all read</button>
        </div>
      </div>
      <div id="notificationListContainer">
        <ul class="list-group" id="notificationList">
          <!-- JS will render notifications -->
        </ul>
      </div>
    </section>
  </main>

  <!-- Component Loader + Notifications JS -->
  <script src="assets/js/utils/componentLoader.js"></script>
  <script type="module" src="assets/js/pages/notification.js"></script>
</body>
</html>
