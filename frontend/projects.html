<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Projects - SMARTTASKER</title>
  <link rel="icon" href="/assets/icons/Profile.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  </head>
<body class="layout">
  <div id="sidebar"></div>
  <main class="main-content">
    <div id="header"></div>
    <section class="content-section mt-4">
      <div class="card p-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4>Projects</h4>
          <div>
            <button id="btnNewProject" class="btn btn-sm btn-primary">New Project</button>
          </div>
        </div>
        <div id="projectsSummary" class="mb-3 small text-muted"></div>
        <div id="projectsTable">Loading projects...</div>
      </div>
    </section>
  </main>

  <!-- Modal for create/edit -->
  <div class="modal fade" id="projectModal" tabindex="-1" aria-hidden="true" style="display:none;">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="projectModalTitle">New Project</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label">Project name</label>
            <input id="projName" class="form-control" />
          </div>
          <div class="mb-2">
            <label class="form-label">Description</label>
            <textarea id="projDesc" class="form-control" rows="3"></textarea>
          </div>
          <div class="mb-2">
            <label class="form-label">Tasks (one per line)</label>
            <textarea id="projTasksText" class="form-control" rows="5" placeholder="Enter one task title per line (optional)"></textarea>
            <div class="form-text">When creating a new project, each line will become a task assigned to the project.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button id="projSave" type="button" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/utils/componentLoader.js"></script>
  <script type="module" src="assets/js/pages/projects.js"></script>
</body>
</html>
